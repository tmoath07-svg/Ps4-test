name: Build PS4 PKG
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y clang lld llvm curl jq tar unzip make build-essential
      - name: Download OpenOrbis toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p "$HOME/ps4dev"
          cd "$HOME/ps4dev"
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/latest \
            -o release.json
          URL=$(jq -r '
            [.assets[]
            | select(.name | test("\\.(tar\\.gz|tgz|zip)$"; "i"))
            | select(.name | test("win|mac|osx"; "i") | not)
            | .browser_download_url][0] // empty
          ' release.json)
          if [ -z "$URL" ]; then
            echo "ERROR: No compatible toolchain archive found."
            jq -r '.assets[].name' release.json
            exit 1
          fi
          curl -fL "$URL" -o archive
          mkdir -p extracted
          case "$URL" in
            *.zip) unzip -q archive -d extracted ;;
            *) tar -xf archive -C extracted ;;
          esac
          HW=$(find "$HOME/ps4dev/extracted" \
            -type d -path '*/samples/hello_world' -print -quit)
          if [ -z "$HW" ]; then
            echo "ERROR: hello_world sample not found."
            find extracted -maxdepth 5 -type f | head -100
            exit 1
          fi
          ROOT="${HW%/samples/hello_world}"
          echo "OO_PS4_TOOLCHAIN=$ROOT" >> "$GITHUB_ENV"
          echo "=== Compiler files ==="
          find "$ROOT" -maxdepth 4 -type f \
            \( -iname '*clang*' -o -iname '*gcc*' -o -iname '*makefile*' \) \
            | head -100
      - name: Prepare project
        run: |
          set -eu
          test -f src/main.c
          rm -rf work
          cp -R "$OO_PS4_TOOLCHAIN/samples/hello_world" work
          echo "=== Sample Makefile ==="
          sed -n '1,180p' work/Makefile
          echo "=== Source files ==="
          find work -type f \
            \( -name '*.c' -o -name '*.cpp' -o -name '*.o' \) \
            -print
          cp src/main.c work/main.c
          echo "=== Toolchain compiler candidates ==="
          find "$OO_PS4_TOOLCHAIN" -type f \
            \( -name 'orbis-clang' -o -name 'orbis-clang++' \) \
            -print
      - name: Diagnose build rules
        working-directory: work
        run: |
          set -eu
          echo "=== Makefile variables and rules ==="
          grep -nE \
            '(^all:|^eboot\.bin:|\.o:|\.c\.o:|SOURCES|OBJECTS|CC[[:space:]]*[:?+]?=|CFLAGS|TITLE|CONTENT_ID|clang)' \
            Makefile || true
          echo "=== Dry run ==="
          make -n
          echo "=== Source files ==="
          find . -type f \( -name '*.c' -o -name '*.cpp' -o -name '*.o' \) -print
          echo "=== Compiler availability ==="
          command -v clang || true
          clang --version
      - name: Stop until compiler rules are verified
        run: |
          echo "Diagnostic build completed."
          echo "The sample Makefile has no working object compilation rule."
          echo "Compiler and Makefile output are available in the Actions log."
          exit 1
