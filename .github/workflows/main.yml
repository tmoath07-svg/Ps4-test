name: Build PS4 PKG
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build PS4 application
        uses: OpenOrbis/toolchain-action@main
        with:
          version: v0.5.1
          command: |
            set -eu
            test -f src/main.c
            cp src/main.c hello_world/main.c
            cd hello_world
            make
            PkgTool.Core pkg_build pkg/pkg.gp4 .
      - name: Upload build files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps4-build-results
          path: |
            hello_world/**/*.pkg
            hello_world/**/*.elf
            hello_world/**/*.bin
          if-no-files-found: ignore
